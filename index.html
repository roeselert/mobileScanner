<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>mobileScanner</title>
  </head>
  <body>
    <div id="app">
      <main id="scanner">
        <video id="camera" playsinline muted autoplay></video>
        <div id="overlay">
          <p id="hint">Point the camera at a QR, Data Matrix or product barcode.</p>
        </div>
      </main>
      <section id="resultPanel" hidden>
        <button id="close">Back to camera</button>
        <dl>
          <dt>Value</dt>
          <dd id="value"></dd>
          <dt>Format</dt>
          <dd id="format"></dd>
          <dt>Scanned at</dt>
          <dd id="time"></dd>
        </dl>
        <button id="copy">Copy value</button>
      </section>
      <nav>
        <button id="nfc">Read NFC tag</button>
        <button id="torch" hidden>Flashlight</button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
